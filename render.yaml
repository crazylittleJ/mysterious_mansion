services:
  - type: web
    name: mysterious_mansion
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      # UPSTASH_REDIS_REST_URL / _TOKEN、GEMINI_API_KEY / _MODEL 都在此 group 內
      - fromGroup: mysterious_mansion_env
