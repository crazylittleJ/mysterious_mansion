services:
  - type: web
    name: mysterious_mansion
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - fromGroup: mysterious_mansion_env
      # Upstash Redis（存檔外部化，缺省時退回記憶體存檔）
      #- key: UPSTASH_REDIS_REST_URL
      #  sync: false
      #- key: UPSTASH_REDIS_REST_TOKEN
      #  sync: false
